version: 1

runtime:
  contract: 1

publication:
  mode: codex_cloud_direct
  branch_prefix: agent/issue-

ownership:
  source: codeowners
  fallback: donghyeon-encored

validation:
  commands:
    - npm run lint
    - npm test

ci:
  required: true
  trigger: pull_request
  workflow: pr-validation.yml
  app_slug: github-actions
  required_checks:
    - Secret-free repository validation
  timeout_seconds: 900

protected_paths:
  additional:
    - infra/production/**
